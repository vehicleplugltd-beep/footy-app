[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footy-data"
version = "0.1.0"
description = "Free/open football data ingestion and feature layer for Footy"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.32",
  "pyarrow>=16",
  "soccerdata>=1.9.1",
]

[project.optional-dependencies]
research = ["socceraction>=1.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
