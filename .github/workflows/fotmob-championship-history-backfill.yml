name: fotmob-championship-history-backfill

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fotmob-championship-history-backfill.yml"

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { season_name: "2022/2023", season_code: "2223", offset: 0 }
          - { season_name: "2022/2023", season_code: "2223", offset: 100 }
          - { season_name: "2022/2023", season_code: "2223", offset: 200 }
          - { season_name: "2022/2023", season_code: "2223", offset: 300 }
          - { season_name: "2022/2023", season_code: "2223", offset: 400 }
          - { season_name: "2022/2023", season_code: "2223", offset: 500 }
          - { season_name: "2023/2024", season_code: "2324", offset: 0 }
          - { season_name: "2023/2024", season_code: "2324", offset: 100 }
          - { season_name: "2023/2024", season_code: "2324", offset: 200 }
          - { season_name: "2023/2024", season_code: "2324", offset: 300 }
          - { season_name: "2023/2024", season_code: "2324", offset: 400 }
          - { season_name: "2023/2024", season_code: "2324", offset: 500 }
          - { season_name: "2024/2025", season_code: "2425", offset: 0 }
          - { season_name: "2024/2025", season_code: "2425", offset: 100 }
          - { season_name: "2024/2025", season_code: "2425", offset: 200 }
          - { season_name: "2024/2025", season_code: "2425", offset: 300 }
          - { season_name: "2024/2025", season_code: "2425", offset: 400 }
          - { season_name: "2024/2025", season_code: "2425", offset: 500 }
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install FotMob-only dependencies
        run: |
          pip install --no-deps -e .
          pip install pandas numpy requests pyarrow
      - name: Backfill Championship history batch
        run: |
          footy-data fotmob-ingest             --league "ENG-Championship"             --season-name "${{ matrix.season_name }}"             --season-code "${{ matrix.season_code }}"             --offset "${{ matrix.offset }}"             --limit 100             --sleep-ms 150             --write
