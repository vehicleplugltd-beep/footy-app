name: backfill-understat

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/backfill-understat.yml"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        season: ["2022", "2023", "2024", "2025"]
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Backfill Premier League season
        run: |
          footy-data understat-ingest \
            --league "ENG-Premier League" \
            --season "${{ matrix.season }}"
