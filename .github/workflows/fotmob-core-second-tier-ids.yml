name: fotmob-core-second-tier-ids

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fotmob-core-second-tier-ids.yml"
      - "web/scripts/diagnose-fotmob-core-second-tiers.mjs"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node web/scripts/diagnose-fotmob-core-second-tiers.mjs
