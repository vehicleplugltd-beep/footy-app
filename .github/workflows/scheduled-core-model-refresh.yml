name: scheduled-core-model-refresh

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scheduled-core-model-refresh.yml"
  schedule:
    - cron: "25 6,18 * * *"

concurrency:
  group: scheduled-core-model-refresh
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league:
          - "ENG-Premier League"
          - "ESP-La Liga"
          - "GER-Bundesliga"
          - "ITA-Serie A"
          - "FRA-Ligue 1"
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEAGUE: ${{ matrix.league }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/betting-edge-workspace
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - name: Refresh current-season underlying process
        run: |
          footy-data understat-ingest --league "$LEAGUE" --season "2026"

      - name: Forecast eight-day fixture window from historical xG
        run: |
          footy-data predict-upcoming \
            --league "$LEAGUE" \
            --season "2026" \
            --history-season "2223" \
            --history-season "2324" \
            --history-season "2425" \
            --history-season "2526" \
            --history-season "2627" \
            --model-version "v7-r16-p50-v20" \
            --process-mode "xg" \
            --process-span 16 \
            --process-prior-weight 0.50 \
            --venue-split-weight 0.20 \
            --lambda-beta 1.0 \
            --home-lambda-scale 1.0 \
            --away-lambda-scale 1.0 \
            --horizon-days 21 \
            --target-ev 0.02

      - name: Report validation status; never promote research automatically
        run: |
          python - <<'PY'
          import os
          from footy_data.storage import SupabaseRESTReader
          league = os.environ["LEAGUE"]
          validation = SupabaseRESTReader().model_market_validation(
              "v7-r16-p50-v20", league=league
          )
          if validation.empty:
              print(f"{league}: no validation record; research only.")
          else:
              print(validation[[
                  "league", "market", "status",
                  "model_log_loss", "benchmark_log_loss",
              ]].to_string(index=False))
          PY

  verify-output:
    needs: forecast
    if: always()
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/betting-edge-workspace
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Verify current model coverage and report schedule gap
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          import requests
          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          now = datetime.now(timezone.utc)
          horizon = now + timedelta(days=21)
          response = requests.get(f"{base}/rest/v1/footy_matches",
              params={"select": "match_id,league,kickoff_at",
                      "kickoff_at": f"gt.{now.isoformat()}",
                      "order": "kickoff_at.asc", "limit": "10000"},
              headers=headers, timeout=30)
          response.raise_for_status()
          core = {"ENG-Premier League", "ESP-La Liga", "GER-Bundesliga", "ITA-Serie A", "FRA-Ligue 1"}
          fixtures = {r["match_id"]: r for r in response.json()
                      if r["league"] in core and datetime.fromisoformat(r["kickoff_at"].replace("Z","+00:00")) <= horizon}
          response = requests.get(f"{base}/rest/v1/footy_model_outputs",
              params={"select": "match_id,selection,home_xg,away_xg,model_probability,fair_odds,minimum_take_price",
                      "model_version": "eq.v7-r16-p50-v20", "market": "eq.1X2", "limit": "10000"},
              headers=headers, timeout=30)
          response.raise_for_status()
          outcomes = {}
          for r in response.json():
              if r["match_id"] not in fixtures or r["home_xg"] is None or r["away_xg"] is None:
                  continue
              if not (0 < float(r["model_probability"]) < 1 and float(r["fair_odds"]) > 1 and float(r["minimum_take_price"]) >= float(r["fair_odds"])):
                  continue
              outcomes.setdefault(r["match_id"], set()).add(r["selection"])
          complete = {mid for mid, selections in outcomes.items() if {"home","draw","away"} <= selections}
          near = {mid for mid, row in fixtures.items() if datetime.fromisoformat(row["kickoff_at"].replace("Z","+00:00")) <= now + timedelta(days=8)}
          print(f"core fixtures in 21d={len(fixtures)} complete forecasts={len(complete)} near-term fixtures={len(near)} near-term forecasts={len(complete & near)}")
          if fixtures and not complete:
              raise SystemExit("Core fixtures exist but no complete current-model forecasts were persisted.")
          if near and not (complete & near):
              raise SystemExit("Near-term core fixtures exist but the model generated none.")
          if not near:
              print("SCHEDULE GAP: no core domestic fixtures in eight days. International fixtures require separate verified process data and model; do not fabricate BET.")
          PY
