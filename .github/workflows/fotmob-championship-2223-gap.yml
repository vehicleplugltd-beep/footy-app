name: fotmob-championship-2223-gap

on:
  workflow_dispatch:

jobs:
  fill-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install FotMob-only dependencies
        run: |
          pip install --no-deps -e .
          pip install pandas numpy requests pyarrow
      - name: Fill missing 2022-23 Championship batch
        run: |
          footy-data fotmob-ingest \
            --league "ENG-Championship" \
            --season-name "2022/2023" \
            --season-code "2223" \
            --offset 400 \
            --limit 100 \
            --sleep-ms 150 \
            --write
