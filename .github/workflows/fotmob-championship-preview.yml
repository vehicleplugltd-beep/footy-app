name: fotmob-championship-preview

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fotmob-championship-preview.yml"
      - "src/footy_data/sources/fotmob_source.py"
      - "src/footy_data/normalizers/fotmob.py"
      - "src/footy_data/cli.py"
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Preview 2025-26 Championship process
        run: |
          footy-data fotmob-preview             --league "ENG-Championship"             --season-name "2025/2026"             --season-code "2526"             --limit 3
