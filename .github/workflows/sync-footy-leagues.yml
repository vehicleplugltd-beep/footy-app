name: sync-footy-leagues

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-footy-leagues.yml"
      - "web/scripts/sync-footy-leagues.mjs"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync active League Edge leagues
        run: node web/scripts/sync-footy-leagues.mjs
