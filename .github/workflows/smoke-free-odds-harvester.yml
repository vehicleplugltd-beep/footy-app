name: smoke-free-odds-harvester

on:
  push:
    branches: ["feature/betting-edge-workspace"]
    paths:
      - ".github/workflows/smoke-free-odds-harvester.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OddsHarvester
        run: |
          python -m pip install --upgrade pip
          pip install "oddsharvester==0.14.0"
          python -m playwright install --with-deps chromium

      - name: Scrape upcoming EPL 1X2
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m oddsharvester upcoming \
            -s football \
            -l england-premier-league \
            -m 1x2 \
            --kickoff-within-hours 168 \
            --bookies-filter all \
            --request-delay 1.2 \
            --concurrency 2 \
            --timezone Europe/London \
            --headless \
            --stream-ndjson \
            > /tmp/odds.ndjson

          test -s /tmp/odds.ndjson

      - name: Summarize smoke output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/odds.ndjson")
          rows = [
              json.loads(line)
              for line in path.read_text().splitlines()
              if line.strip().startswith("{")
          ]

          print(f"FOOTY_SMOKE_MATCHES={len(rows)}")
          bookmaker_quotes = 0
          for row in rows:
              market = row.get("1x2_market") or []
              bookmaker_quotes += len(market)

          print(f"FOOTY_SMOKE_BOOKMAKER_QUOTES={bookmaker_quotes}")

          for row in rows[:3]:
              market = row.get("1x2_market") or []
              best_home = max(
                  (float(x["1"]) for x in market if x.get("1")),
                  default=None,
              )
              best_draw = max(
                  (float(x["X"]) for x in market if x.get("X")),
                  default=None,
              )
              best_away = max(
                  (float(x["2"]) for x in market if x.get("2")),
                  default=None,
              )
              print(json.dumps({
                  "home": row.get("home_team"),
                  "away": row.get("away_team"),
                  "kickoff": row.get("match_date"),
                  "bookmakers": len(market),
                  "best_1x2": [best_home, best_draw, best_away],
              }))
          PY
