name: smoke-free-odds-harvester

on:
  push:
    branches: ["feature/betting-edge-workspace"]
    paths:
      - ".github/workflows/smoke-free-odds-harvester.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OddsHarvester
        run: |
          python -m pip install --upgrade pip
          pip install "oddsharvester==0.14.0"
          python -m playwright install --with-deps chromium

      - name: Scrape upcoming EPL 1X2
        id: scrape
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 10m oddsharvester upcoming \
            -s football \
            -l england-premier-league \
            -d 20260926 \
            -m 1x2 \
            --bookies-filter all \
            --request-delay 1.2 \
            --concurrency 2 \
            --timezone Europe/London \
            --headless \
            --stream-ndjson \
            > /tmp/odds.ndjson 2>/tmp/odds.stderr
          code=$?
          echo "$code" >/tmp/odds.exit
          if [ "$code" -ne 0 ]; then
            cat /tmp/odds.stderr
            exit "$code"
          fi
          test -s /tmp/odds.ndjson

      - name: Summarize smoke output
        if: always()
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/odds.ndjson")
          rows = [
              json.loads(line)
              for line in path.read_text().splitlines()
              if line.strip().startswith("{")
          ]

          print(f"FOOTY_SMOKE_MATCHES_DATE_20260926={len(rows)}")
          bookmaker_quotes = 0
          for row in rows:
              market = row.get("1x2_market") or []
              bookmaker_quotes += len(market)

          print(f"FOOTY_SMOKE_BOOKMAKER_QUOTES={bookmaker_quotes}")

          for row in rows[:3]:
              market = row.get("1x2_market") or []
              best_home = max(
                  (float(x["1"]) for x in market if x.get("1")),
                  default=None,
              )
              best_draw = max(
                  (float(x["X"]) for x in market if x.get("X")),
                  default=None,
              )
              best_away = max(
                  (float(x["2"]) for x in market if x.get("2")),
                  default=None,
              )
              print(json.dumps({
                  "home": row.get("home_team"),
                  "away": row.get("away_team"),
                  "kickoff": row.get("match_date"),
                  "bookmakers": len(market),
                  "best_1x2": [best_home, best_draw, best_away],
              }))

          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          import os

          now = datetime.now(timezone.utc).isoformat()
          stderr = Path("/tmp/odds.stderr")
          outcome = os.environ.get("SCRAPE_OUTCOME", "unknown")
          payload = [{
              "provider": "oddsharvester-smoke",
              "sport_key": "football",
              "last_attempt_at": now,
              "last_success_at": now if outcome == "success" and rows else None,
              "events_received": len(rows),
              "prices_received": bookmaker_quotes * 3,
              "last_error": None if outcome == "success" and rows else (
                  stderr.read_text(errors="ignore")[-900:] if stderr.exists()
                  else f"scrape outcome={outcome}"
              ),
              "updated_at": now,
          }]

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          req = Request(
              base + "/rest/v1/footy_odds_feed_status?on_conflict=provider",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "Prefer": "resolution=merge-duplicates,return=minimal",
              },
          )
          with urlopen(req, timeout=30):
              pass
          PY
