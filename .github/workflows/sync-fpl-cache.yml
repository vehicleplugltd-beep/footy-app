name: sync-fpl-cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-fpl-cache.yml"
      - "web/scripts/sync-fpl-cache.mjs"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache official FPL data in Supabase
        run: node web/scripts/sync-fpl-cache.mjs
