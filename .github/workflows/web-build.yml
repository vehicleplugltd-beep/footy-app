name: web-build

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: node --check scripts/sync-live-odds.mjs
      - run: node --check scripts/import-oddsharvester.mjs
      - run: node --check scripts/sync-free-oddsportal.mjs
      - run: node --check scripts/sync-free-flashscore.mjs
      - run: node scripts/test-flashscore-parser.mjs
      - run: node scripts/diagnose-flashscore-context.mjs
      - run: python -m py_compile scripts/fetch-sofascore.py
      - run: npm run build
      - run: timeout --signal=TERM --kill-after=5s 180s node scripts/smoke-betting-routes.mjs
      - run: npm install --no-save --no-audit --no-fund puppeteer-core@24.21.0
      - run: timeout --signal=TERM --kill-after=5s 180s node scripts/smoke-betting-browser.mjs
