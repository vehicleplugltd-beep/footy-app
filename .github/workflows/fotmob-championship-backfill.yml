name: fotmob-championship-backfill

on:
  workflow_dispatch:
    inputs:
      season_name:
        description: "FotMob season, e.g. 2025/2026"
        required: true
        default: "2025/2026"
      season_code:
        description: "Footy season code, e.g. 2526"
        required: true
        default: "2526"
      offset:
        description: "Finished-match offset"
        required: true
        default: "0"
      limit:
        description: "Batch size"
        required: true
        default: "100"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install FotMob-only dependencies
        run: |
          pip install --no-deps -e .
          pip install pandas numpy requests pyarrow
      - name: Backfill Championship batch
        run: |
          footy-data fotmob-ingest             --league "ENG-Championship"             --season-name "${{ inputs.season_name }}"             --season-code "${{ inputs.season_code }}"             --offset "${{ inputs.offset }}"             --limit "${{ inputs.limit }}"             --sleep-ms 150             --write
