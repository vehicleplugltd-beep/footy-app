name: Verify and ingest FPL-Core enrichment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-fpl-core.yml"
      - "src/footy_data/sources/fpl_core_insights.py"
      - "src/footy_data/normalizers/fpl_core_insights.py"
      - "src/footy_data/identity.py"
      - "src/footy_data/verification.py"
      - "src/footy_data/storage.py"
      - "src/footy_data/consensus.py"
      - "src/footy_data/cli.py"
      - "sql/schema.sql"
  schedule:
    # Upstream advertises twice-daily refreshes at 07:30 and 17:30 UTC.
    - cron: "15 8,18 * * *"
  workflow_dispatch:
    inputs:
      gameweek:
        description: "FPL Gameweek override (leave blank to auto-detect)"
        required: false
        type: string

concurrency:
  group: ingest-fpl-core-current
  cancel-in-progress: true

jobs:
  verify-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Resolve current Gameweek
        id: gw
        env:
          OVERRIDE_GW: ${{ github.event.inputs.gameweek }}
        run: |
          python - <<'PY'
          import os, requests
          override = (os.environ.get("OVERRIDE_GW") or "").strip()
          if override:
              gw = int(override)
          else:
              data = requests.get(
                  "https://fantasy.premierleague.com/api/bootstrap-static/",
                  timeout=30,
                  headers={"User-Agent":"Mozilla/5.0","Referer":"https://fantasy.premierleague.com/"},
              ).json()
              current = next((e for e in data["events"] if e.get("is_current")), None)
              if current is None:
                  current = next((e for e in data["events"] if not e.get("finished")), None)
              if current is None:
                  raise SystemExit("No current/upcoming FPL event.")
              gw = int(current["id"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"gameweek={gw}\n")
          print(f"Using GW{gw}")
          PY

      - name: Derive season penalty xG convention
        id: penalty
        shell: bash
        run: |
          CURRENT_GW="${{ steps.gw.outputs.gameweek }}"
          python - <<'PY'
          import os
          import pandas as pd
          from footy_data.sources.fpl_core_insights import FPLCoreInsightsSource
          from footy_data.normalizers.fpl_core_insights import verified_penalty_xg_value

          current_gw = int(os.environ["CURRENT_GW"])
          source = FPLCoreInsightsSource()
          frames = []
          for gw in range(1, current_gw + 1):
              frame = source.player_match_stats(gw)
              if not frame.empty:
                  frames.append(frame)
          if not frames:
              raise SystemExit("No FPL-Core player-match rows available.")
          value = verified_penalty_xg_value(pd.concat(frames, ignore_index=True))
          if value is None:
              raise SystemExit(
                  "Season-to-date FPL-Core penalty xG convention could not be validated."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"value={value:.4f}\n")
          print(f"Validated FPL-Core penalty xG: {value:.4f}")
          PY
        env:
          CURRENT_GW: ${{ steps.gw.outputs.gameweek }}

      - name: Verify then ingest enrichment
        shell: bash
        run: |
          CURRENT_GW="${{ steps.gw.outputs.gameweek }}"
          PENALTY_XG="${{ steps.penalty.outputs.value }}"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Backfilling verified enrichment through GW${CURRENT_GW}"
            for GW in $(seq 1 "$CURRENT_GW"); do
              echo "=== Verify GW${GW} ==="
              footy-data fpl-core-ingest \
                --gameweek "$GW" \
                --league "ENG-Premier League" \
                --season "2627" \
                --min-match-rate 0.92 \
                --penalty-xg-value "$PENALTY_XG"
            done
          else
            footy-data fpl-core-ingest \
              --gameweek "$CURRENT_GW" \
              --league "ENG-Premier League" \
              --season "2627" \
              --min-match-rate 0.92 \
              --penalty-xg-value "$PENALTY_XG"
          fi
