name: diagnose-current

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-current.yml"
      - "src/footy_data/diagnostics.py"
      - "src/footy_data/cli.py"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Diagnose upcoming Premier League process
        run: |
          footy-data diagnose-upcoming \
            --league "ENG-Premier League" \
            --season "2026" \
            --horizon-days 3
