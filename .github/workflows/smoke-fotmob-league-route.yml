name: smoke-fotmob-league-route

on:
  push:
    branches: ["feature/betting-edge-workspace"]
    paths:
      - ".github/workflows/smoke-fotmob-league-route.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect FotMob Championship season payload
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          HEADERS = {
              "Accept": "application/json,text/plain,*/*",
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Referer": "https://www.fotmob.com/",
          }

          def get(params):
              url = (
                  "https://www.fotmob.com/api/data/leagues?"
                  + urllib.parse.urlencode(params)
              )
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response)

          attempts = [
              {"id": 48, "ccode3": "ENG"},
              {"id": 48, "ccode3": "ENG", "season": "2025/2026"},
              {"id": 48, "ccode3": "ENG", "season": "2026/2027"},
          ]

          for params in attempts:
              payload = get(params)
              fixtures = payload.get("fixtures")
              available = payload.get("allAvailableSeasons")
              seasons = payload.get("seasons")

              if isinstance(fixtures, dict):
                  fixture_summary = {
                      "keys": list(fixtures.keys()),
                      "sample": {},
                  }
                  for key, value in fixtures.items():
                      if isinstance(value, list):
                          fixture_summary["sample"][key] = {
                              "count": len(value),
                              "first": value[:2],
                              "last": value[-2:],
                          }
                      elif isinstance(value, dict):
                          fixture_summary["sample"][key] = {
                              "keys": list(value.keys()),
                              "preview": {
                                  k: (
                                      len(v) if isinstance(v, list) else v
                                  )
                                  for k, v in list(value.items())[:6]
                              },
                          }
                      else:
                          fixture_summary["sample"][key] = value
              else:
                  fixture_summary = {
                      "type": type(fixtures).__name__,
                      "value": fixtures,
                  }

              print(
                  "FOOTY_FOTMOB_SEASON_PAYLOAD="
                  + json.dumps(
                      {
                          "params": params,
                          "details": payload.get("details"),
                          "available": available,
                          "seasons_preview": (
                              seasons[:5]
                              if isinstance(seasons, list)
                              else seasons
                          ),
                          "fixtures": fixture_summary,
                      },
                      default=str,
                  )
              )
          PY
