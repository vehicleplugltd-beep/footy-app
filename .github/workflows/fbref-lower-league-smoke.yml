name: fbref-lower-league-smoke

on:
  workflow_dispatch:

jobs:
  championship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Probe Championship FBref schedule only
        run: |
          footy-data fbref-smoke             --league "ENG-Championship"             --season "2026"             --stat-type "schedule"
