name: sync-live-odds
on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: live-odds-refresh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # Scheduled workflows run from the default branch. Use the maintained
      # betting workspace branch rather than the parked main application.
      - uses: actions/checkout@v4
        with:
          ref: feature/betting-edge-workspace
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check collector credentials
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Refresh free fixture spine
        env:
          FIXTURES_ONLY: "1"
        run: node web/scripts/sync-live-odds.mjs
      - name: Collect free multi-bookmaker prices
        id: collect
        timeout-minutes: 24
        run: node web/scripts/sync-free-flashscore.mjs
      - name: Report forecast-to-price coverage
        if: always() && steps.collect.outcome == 'success'
        run: node web/scripts/edge-coverage-diagnostics.mjs
      - name: Process alerts and closing lines
        if: always() && steps.collect.outcome == 'success'
        env:
          PRICE_OPS_ONLY: "1"
        run: node web/scripts/sync-live-odds.mjs
