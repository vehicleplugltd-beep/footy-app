name: sync-live-odds
on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
  push:
    branches: ["main", "feature/betting-edge-workspace"]
    paths:
      - ".github/workflows/sync-live-odds.yml"
      - "web/scripts/sync-live-odds.mjs"
      - "web/scripts/sync-free-oddsportal.mjs"
      - "web/scripts/sync-free-flashscore.mjs"

concurrency:
  group: live-odds-refresh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh free fixture spine
        env:
          FIXTURES_ONLY: "1"
        run: node web/scripts/sync-live-odds.mjs

      - name: Collect free multi-bookmaker prices
        id: collect
        timeout-minutes: 24
        run: node web/scripts/sync-free-flashscore.mjs
      - name: Report collector status
        if: always()
        run: echo "Flashscore collection outcome=${{ steps.collect.outcome }}; zero prices must fail the collector."

      - name: Process alerts and closing lines
        if: always() && steps.collect.outcome == 'success'
        env:
          PRICE_OPS_ONLY: "1"
        run: node web/scripts/sync-live-odds.mjs
