name: second-bundesliga-forward-research

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6,18 * * *"

concurrency:
  group: second-bundesliga-forward-research
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - name: Sync verified FotMob second Bundesliga fixtures
        run: |
          footy-data fotmob-fixtures-ingest \
            --league "GER-2. Bundesliga" \
            --season-name "current" \
            --season-code "2627"

      - name: Generate xG-based research forecasts
        run: |
          footy-data predict-upcoming \
            --league "GER-2. Bundesliga" \
            --season "2627" \
            --history-season "2223" \
            --history-season "2324" \
            --history-season "2425" \
            --history-season "2526" \
            --history-season "2627" \
            --model-version "v7-r16-p50-v20" \
            --process-mode "xg" \
            --process-span 16 \
            --process-prior-weight 0.50 \
            --venue-split-weight 0.20 \
            --lambda-beta 1.0 \
            --home-lambda-scale 1.0 \
            --away-lambda-scale 1.0 \
            --horizon-days 8 \
            --target-ev 0.02

      - name: Report validation status without promoting research to bets
        run: |
          python - <<'PY'
          from footy_data.storage import SupabaseRESTReader
          validation = SupabaseRESTReader().model_market_validation(
              "v7-r16-p50-v20", league="GER-2. Bundesliga"
          )
          if validation.empty:
              print("No validation record: research only.")
          else:
              print(validation[[
                  "league", "market", "status",
                  "model_log_loss", "benchmark_log_loss",
              ]].to_string(index=False))
          PY
