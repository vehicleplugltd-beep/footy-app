name: fotmob-core-second-tier-smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fotmob-core-second-tier-smoke.yml"
      - "src/footy_data/sources/fotmob_source.py"
      - "src/footy_data/normalizers/fotmob.py"
      - "src/footy_data/cli.py"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - league: "ESP-La Liga 2"
          - league: "GER-2. Bundesliga"
          - league: "ITA-Serie B"
          - league: "FRA-Ligue 2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install FotMob-only dependencies
        run: |
          pip install --no-deps -e .
          pip install pandas numpy requests pyarrow
      - name: Verify current-season process fields
        run: |
          footy-data fotmob-preview \
            --league "${{ matrix.league }}" \
            --season-name "current" \
            --season-code "2627" \
            --limit 3
