name: bootstrap-championship-model

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/betting-edge-workspace
    paths:
      - ".github/workflows/bootstrap-championship-model.yml"
      - "src/footy_data/quality_gate.py"
      - "src/footy_data/quality_evaluation.py"
      - "src/footy_data/storage.py"
      - "src/footy_data/cli.py"

concurrency:
  group: bootstrap-championship-model
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEAGUE: ENG-Championship
      BASELINE_MODEL: v7-r16-p50-v20
      SCHEDULE_MODEL: championship-v8-schedule-r16-p50-v20
      NPXG_MODEL: championship-v9-npxg70-r16-p50-v20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - name: Gate on independently verified completed-season history
        run: |
          python - <<'PY'
          from footy_data.storage import SupabaseRESTReader

          frame = SupabaseRESTReader().historical_match_team_metrics(
              league="ENG-Championship",
              seasons=["2223", "2324", "2425", "2526"],
          )
          counts = frame.groupby(frame["season"].astype(str)).size().to_dict()
          print("VERIFIED_CHAMPIONSHIP_TEAM_ROWS", counts)

          expected = {
              "2223": 1104,
              "2324": 1104,
              "2425": 1104,
              "2526": 1104,
          }
          bad = {
              season: {"expected": target, "actual": int(counts.get(season, 0))}
              for season, target in expected.items()
              if int(counts.get(season, 0)) != target
          }
          if bad:
              raise SystemExit(
                  f"Verified Championship regular-season history is not exact: {bad}"
              )

          required = ["xg", "xga", "npxg", "npxga", "shots", "shots_on_target"]
          missing = {
              column: int(frame[column].isna().sum())
              for column in required
              if column not in frame.columns or frame[column].isna().any()
          }
          if missing:
              raise SystemExit(
                  f"Championship process history has core metric gaps: {missing}"
              )
          PY

      - name: Walk-forward baseline xG before inspecting prices
        run: |
          footy-data calibrate \
            --league "$LEAGUE" \
            --season "2223" \
            --season "2324" \
            --season "2425" \
            --season "2526" \
            --model-version "$BASELINE_MODEL" \
            --process-mode "xg" \
            --process-span 16 \
            --process-prior-weight 0.50 \
            --venue-split-weight 0.20 \
            --lambda-beta 1.0 \
            --home-lambda-scale 1.0 \
            --away-lambda-scale 1.0

      - name: Walk-forward schedule-adjusted challenger before prices
        run: |
          footy-data calibrate \
            --league "$LEAGUE" \
            --season "2223" \
            --season "2324" \
            --season "2425" \
            --season "2526" \
            --model-version "$SCHEDULE_MODEL" \
            --process-mode "schedule_adjusted" \
            --process-span 16 \
            --process-prior-weight 0.50 \
            --venue-split-weight 0.20 \
            --lambda-beta 1.0 \
            --home-lambda-scale 1.0 \
            --away-lambda-scale 1.0

      - name: Walk-forward npxG challenger before prices
        run: |
          footy-data calibrate \
            --league "$LEAGUE" \
            --season "2223" \
            --season "2324" \
            --season "2425" \
            --season "2526" \
            --model-version "$NPXG_MODEL" \
            --process-mode "npxg_blend" \
            --npxg-weight 0.70 \
            --process-span 16 \
            --process-prior-weight 0.50 \
            --venue-split-weight 0.20 \
            --lambda-beta 1.0 \
            --home-lambda-scale 1.0 \
            --away-lambda-scale 1.0

      - name: Import historical prices only after probabilities are frozen
        run: |
          footy-data football-data-odds-ingest \
            --league "$LEAGUE" \
            --season "2223" \
            --season "2324" \
            --season "2425" \
            --season "2526" \
            --min-match-rate 0.99

      - name: Freeze baseline probability and price quality
        run: |
          for MARKET in "1X2" "TOTAL_2.5"; do
            footy-data quality-evaluate \
              --league "$LEAGUE" \
              --season "2223" \
              --season "2324" \
              --season "2425" \
              --season "2526" \
              --model-version "$BASELINE_MODEL" \
              --market "$MARKET" \
              --bookmaker "Market Average" \
              --source "football-data.co.uk" \
              --target-ev 0.02
          done

      - name: Freeze schedule challenger against baseline
        run: |
          for MARKET in "1X2" "TOTAL_2.5"; do
            footy-data quality-evaluate \
              --league "$LEAGUE" \
              --season "2223" \
              --season "2324" \
              --season "2425" \
              --season "2526" \
              --model-version "$SCHEDULE_MODEL" \
              --baseline-model-version "$BASELINE_MODEL" \
              --market "$MARKET" \
              --bookmaker "Market Average" \
              --source "football-data.co.uk" \
              --target-ev 0.02
          done

      - name: Freeze npxG challenger against baseline
        run: |
          for MARKET in "1X2" "TOTAL_2.5"; do
            footy-data quality-evaluate \
              --league "$LEAGUE" \
              --season "2223" \
              --season "2324" \
              --season "2425" \
              --season "2526" \
              --model-version "$NPXG_MODEL" \
              --baseline-model-version "$BASELINE_MODEL" \
              --market "$MARKET" \
              --bookmaker "Market Average" \
              --source "football-data.co.uk" \
              --target-ev 0.02
          done

      - name: Print frozen Championship quality board
        run: |
          python - <<'PY'
          from footy_data.storage import SupabaseRESTReader

          reader = SupabaseRESTReader()
          rows = reader.model_quality_snapshots(
              league="ENG-Championship",
          )
          wanted = {
              "v7-r16-p50-v20",
              "championship-v8-schedule-r16-p50-v20",
              "championship-v9-npxg70-r16-p50-v20",
          }
          if rows.empty:
              raise SystemExit("No Championship quality snapshots were persisted.")

          board = rows[rows["model_version"].astype(str).isin(wanted)].copy()
          cols = [
              "model_version", "market", "sample_size",
              "model_log_loss", "benchmark_log_loss",
              "calibration_error", "price_sample_size",
              "mean_clv", "realized_roi",
              "gate_status", "validation_status",
          ]
          print(board[cols].to_string(index=False))
          PY
