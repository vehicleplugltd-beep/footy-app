name: ingest-understat

on:
  workflow_dispatch:
    inputs:
      league:
        description: soccerdata league identifier
        required: true
        default: ENG-Premier League
      season:
        description: soccerdata season identifier
        required: true
        default: "2026"
      with_shots:
        description: include shot-level aggregation
        required: true
        type: boolean
        default: true
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ingest-understat.yml"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Ingest Understat
        shell: bash
        run: |
          LEAGUE="${{ inputs.league || 'ENG-Premier League' }}"
          SEASON="${{ inputs.season || '2026' }}"
          WITH_SHOTS="${{ inputs.with_shots }}"

          ARGS=(understat-ingest --league "$LEAGUE" --season "$SEASON")

          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$WITH_SHOTS" = "true" ]; then
            ARGS+=(--with-shots)
          fi

          footy-data "${ARGS[@]}"
