name: calibrate-regression-grid

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/calibrate-regression-grid.yml"
      - "src/footy_data/walk_forward.py"
      - "src/footy_data/features.py"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: "v7-r12-p50-v25"
            span: 12
            prior: 0.50
            venue: 0.25
          - model: "v7-r12-p60-v20"
            span: 12
            prior: 0.60
            venue: 0.20
          - model: "v7-r16-p50-v20"
            span: 16
            prior: 0.50
            venue: 0.20
          - model: "v7-r16-p60-v20"
            span: 16
            prior: 0.60
            venue: 0.20
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Run conservative process candidate
        run: |
          footy-data calibrate \
            --league "ENG-Premier League" \
            --season "2223" \
            --season "2324" \
            --season "2425" \
            --season "2526" \
            --model-version "${{ matrix.model }}" \
            --process-mode "schedule_adjusted" \
            --process-span "${{ matrix.span }}" \
            --process-prior-weight "${{ matrix.prior }}" \
            --venue-split-weight "${{ matrix.venue }}"
