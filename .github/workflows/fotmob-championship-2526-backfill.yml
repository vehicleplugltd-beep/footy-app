name: fotmob-championship-2526-backfill

on:
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        offset: [0, 100, 200, 300, 400, 500]
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install FotMob-only dependencies
        run: |
          pip install --no-deps -e .
          pip install pandas numpy requests pyarrow
      - name: Backfill 2025-26 Championship batch
        run: |
          footy-data fotmob-ingest             --league "ENG-Championship"             --season-name "2025/2026"             --season-code "2526"             --offset "${{ matrix.offset }}"             --limit 100             --sleep-ms 150             --write
