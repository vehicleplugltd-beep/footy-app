name: calibrate-v6

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/calibrate-v6.yml"
      - "src/footy_data/model.py"
      - "src/footy_data/features.py"
      - "src/footy_data/walk_forward.py"
      - "src/footy_data/xg_engine.py"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Run schedule-adjusted calibrated model
        run: |
          footy-data calibrate \
            --league "ENG-Premier League" \
            --season "2223" \
            --season "2324" \
            --season "2425" \
            --season "2526" \
            --model-version "baseline-v6-schedule-calibrated" \
            --process-mode "schedule_adjusted" \
            --lambda-beta 1.05 \
            --home-lambda-scale 0.985953318340048 \
            --away-lambda-scale 1.12646161962879
