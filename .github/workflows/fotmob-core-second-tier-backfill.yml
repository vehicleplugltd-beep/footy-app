name: fotmob-core-second-tier-backfill

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fotmob-core-second-tier-backfill.yml"
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league:
          - "ESP-La Liga 2"
          - "GER-2. Bundesliga"
          - "ITA-Serie B"
          - "FRA-Ligue 2"
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEAGUE: ${{ matrix.league }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: Install FotMob-only dependencies
        run: |
          pip install --no-deps -e .
          pip install pandas numpy requests pyarrow
      - name: Backfill verified process history
        shell: bash
        run: |
          set -euo pipefail
          ingest () {
            local season_name="$1"
            local season_code="$2"
            echo "== $LEAGUE / $season_code =="
            footy-data fotmob-ingest \
              --league "$LEAGUE" \
              --season-name "$season_name" \
              --season-code "$season_code" \
              --offset 0 \
              --limit 10000 \
              --sleep-ms 100 \
              --write
          }

          ingest "2022/2023" "2223"
          ingest "2023/2024" "2324"
          ingest "2024/2025" "2425"
          ingest "2025/2026" "2526"
          ingest "current" "2627"
