name: calibrate-npxg

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/calibrate-npxg.yml"

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://nlmtcimkqymynsyflimv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Run npxG-weighted walk-forward calibration
        run: |
          footy-data calibrate \
            --league "ENG-Premier League" \
            --season "2223" \
            --season "2324" \
            --season "2425" \
            --season "2526" \
            --model-version "baseline-v3-npxg70" \
            --process-mode "npxg_blend" \
            --npxg-weight 0.70
